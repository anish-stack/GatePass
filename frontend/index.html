<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>GatePass Pro - Factory Guard Attendance System</title>
    <meta name="description" content="Industrial guard-operated factory attendance and payroll management system with photo proof and strict role accountability." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply saved theme before paint (no flash)
      try {
        var t = localStorage.getItem('gatepass_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.className = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
